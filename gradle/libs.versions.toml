[versions]
# AGP 8.13.x + Gradle 8.x is the newest line that supports compileSdk 36.
# Moving to AGP 9.x requires compileSdk 37 and a Gradle 9 upgrade.
agp = "8.13.2"
kotlin = "2.4.21"
compileSdk = "36"
minSdk = "26"
targetSdk = "36"
# Pinned: core 1.19+ requires compileSdk 37 / AGP 9.1+. Upgrade with the toolchain.
coreKtx = "1.18.0"
appcompat = "1.8.0"
material = "1.14.0"
webkit = "1.18.0"
activity = "1.13.0"
splashscreen = "1.2.0"
swiperefreshlayout = "1.2.0"
constraintlayout = "2.2.2"
junit = "4.13.2"

[libraries]
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }
androidx-appcompat = { module = "androidx.appcompat:appcompat", version.ref = "appcompat" }
androidx-activity = { module = "androidx.activity:activity-ktx", version.ref = "activity" }
androidx-webkit = { module = "androidx.webkit:webkit", version.ref = "webkit" }
androidx-splashscreen = { module = "androidx.core:core-splashscreen", version.ref = "splashscreen" }
androidx-swiperefreshlayout = { module = "androidx.swiperefreshlayout:swiperefreshlayout", version.ref = "swiperefreshlayout" }
androidx-constraintlayout = { module = "androidx.constraintlayout:constraintlayout", version.ref = "constraintlayout" }
material = { module = "com.google.android.material:material", version.ref = "material" }
junit = { module = "junit:junit", version.ref = "junit" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
